name: NEXA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Polish media gallery
        run: |
          python3 scripts/polish_gallery.py
          if git diff --quiet; then
            echo "No gallery commit needed"
          else
            git config user.name "NEXA Automation"
            git config user.email "actions@nexa.local"
            git add app/profile/page.tsx app/profile/profile.module.css scripts/polish_gallery.py
            git commit -m "Polish NEXA media gallery"
            git push
          fi
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
