name: NEXA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Polish media gallery
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          page = Path('app/profile/page.tsx')
          css = Path('app/profile/profile.module.css')
          p = page.read_text()
          c = css.read_text()
          changed = False

          if 'NEXA_GALLERY_V3' not in c:
              c += '''\n/* NEXA_GALLERY_V3 */\n.mediaGalleryV3{display:grid !important;grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:12px !important;margin-top:4px}.mediaCardV3{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.1) !important;border-radius:22px !important;background:linear-gradient(145deg,#10131b,#07080c) !important;box-shadow:0 14px 40px rgba(0,0,0,.24)}.mediaImageV3{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;cursor:zoom-in;transition:transform .28s ease,filter .28s ease}.mediaCardV3:hover .mediaImageV3{transform:scale(1.025);filter:saturate(1.06)}.mediaActionsV3{display:grid !important;grid-template-columns:1fr 1fr 1fr;gap:7px !important;padding:9px !important;background:rgba(8,10,15,.96)}.mediaActionsV3 button{min-width:0 !important;min-height:38px;padding:7px 5px !important;border:1px solid rgba(255,255,255,.1) !important;border-radius:12px !important;background:#11141c !important;color:#f5f6fa !important;font:600 14px/1 system-ui,sans-serif !important;cursor:pointer}.mediaActionsV3 button:hover{border-color:rgba(145,100,255,.55) !important;background:#171a25 !important}.mediaActionsV3 button.liked{color:#ff4f91 !important}@media(max-width:520px){.mediaGalleryV3{gap:8px !important}.mediaActionsV3{gap:5px !important;padding:7px !important}.mediaActionsV3 button{min-height:36px;font-size:13px !important}}\n'''
              changed = True

          replacements = [
              ("<div style={{display:'grid',gridTemplateColumns:'repeat(2,minmax(0,1fr))',gap:10}}>", "<div className={styles.mediaGalleryV3}>") ,
              ("<div key={post.id} style={{position:'relative',borderRadius:18,overflow:'hidden',background:'#090b10',border:'1px solid #242936'}}>", "<div key={post.id} className={styles.mediaCardV3}>") ,
              ("<img src={post.media_url||''} alt=\"Фото\" style={{display:'block',width:'100%',aspectRatio:'1/1',objectFit:'cover'}}/>", "<img src={post.media_url||''} alt=\"Фото\" className={styles.mediaImageV3} onClick={()=>window.open(post.media_url||'', '_blank')}/>") ,
              ("<div style={{display:'flex',justifyContent:'space-between',gap:6,padding:8}}>", "<div className={styles.mediaActionsV3}>")
          ]
          for old, new in replacements:
              if old in p:
                  p = p.replace(old, new, 1)
                  changed = True

          if changed:
              page.write_text(p)
              css.write_text(c)
          PY
          if git diff --quiet; then
            echo "No gallery changes needed"
          else
            git config user.name "NEXA Automation"
            git config user.email "actions@nexa.local"
            git add app/profile/page.tsx app/profile/profile.module.css
            git commit -m "Polish NEXA media gallery"
            git push
          fi
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
